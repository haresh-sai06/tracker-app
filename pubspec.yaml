name: tracker_app
description: "A Transaction tracker application built on Flutter and Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  freezed_annotation: ^2.4.4
  crypto: ^3.0.3
  http: ^1.2.2
  package_info_plus: ^8.0.0
  webview_flutter: ^4.8.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
